{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <link
      rel="icon"
      type="image/png"
      href="{% static 'images/d7484e1e-3a8d-4afe-801c-4f31f36b7ae1.png' %}"
    />
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Connexion | SAREF Academy</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="{% static 'css/espace.css' %}" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="candidate-shell">
      <div class="candidate-wrap" style="max-width: 460px; padding-top: 7vh">
        <a class="candidate-brand" href="/">
          <span class="brand-mark">S</span>
          SAREF Academy
        </a>
        <div class="card pad">
          <span class="badge b-blue">Espace sécurisé</span>
          <h1 class="title mt-2">Bon retour 👋</h1>
          <p class="subtitle">
            Connectez-vous pour retrouver vos formations et candidatures.
          </p>
          <div class="field mt-4">
            <label>Email</label>
            <input class="input" placeholder="vous@example.com" type="email" />
          </div>
          <div class="field mt-3">
            <label>Mot de passe</label>
            <input class="input" placeholder="••••••••" type="password" />
          </div>
          <button class="btn btn-primary w-100 mt-4">Se connecter</button>
          <p class="text-center small mt-4 mb-0">
            Pas encore de compte ?
            <a
              href="/inscription/"
              style="color: var(--primary); font-weight: 700"
            >
              Créer un compte
            </a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
