{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Inscription | SAREF Academy</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link href="{% static 'css/espace.css' %}" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="candidate-shell">
      <div class="candidate-wrap" style="max-width: 460px; padding-top: 7vh">
        <a class="candidate-brand" href="/">
          <span class="brand-mark">S</span>
          SAREF Academy
        </a>
        <div class="card pad">
          <span class="badge b-blue">Espace sécurisé</span>
          <h1 class="title mt-2">Créez votre compte</h1>
          <p class="subtitle">
            Inscrivez-vous pour déposer et suivre vos candidatures.
          </p>
          <div class="field mt-4">
            <label>Nom et prénom</label>
            <input class="input" placeholder="Votre nom complet" />
          </div>
          <div class="field mt-3">
            <label>Email</label>
            <input class="input" placeholder="vous@example.com" type="email" />
          </div>
          <div class="field mt-3">
            <label>Mot de passe</label>
            <input class="input" placeholder="••••••••" type="password" />
          </div>
          <button class="btn btn-primary w-100 mt-4">Créer mon compte</button>
          <p class="text-center small mt-4 mb-0">
            Déjà inscrit ?
            <a
              href="/connexion/"
              style="color: var(--primary); font-weight: 700"
            >
              Se connecter
            </a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
