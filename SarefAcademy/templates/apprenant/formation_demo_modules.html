{% load static %}
<article class="acc-item done reveal">
  <button
    class="acc-head"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#{{ prefix }}-1"
    aria-expanded="true"
    aria-controls="{{ prefix }}-1"
  >
    <span class="acc-num">1</span>
    <span class="acc-title">
      <b>{{ m1 }}</b>
      <small>2 chapitres · Module publié</small>
    </span>
    <span class="s-badge b-active">
      <i class="bi bi-unlock me-1"></i>
      Disponible
    </span>
    <i class="bi bi-chevron-down acc-chevron"></i>
  </button>
  <div id="{{ prefix }}-1" class="collapse acc-body show">
    <div class="chap">
      <i class="bi bi-play-circle ci t-blue"></i>
      <span>
        {{ c1 }}
        <small class="d-block text-secondary">Vidéo · PDF · 20 min</small>
      </span>
      <span class="ms-auto">
        <a
          class="btn-s btn-primary-s btn-sm-s"
          href="{% url 'apprenant_module_detail' 1 %}?formation={{ prefix }}&amp;module=1&amp;chapitre=1"
        >
          <i class="bi bi-box-arrow-up-right me-1"></i>
          Ouvrir le chapitre
        </a>
      </span>
    </div>
    <div class="chap">
      <i class="bi bi-lock ci text-secondary"></i>
      <span>{{ c2 }}</span>
      <span class="ms-auto">
        <span class="s-badge b-brouillon">Chapitre non publié</span>
      </span>
    </div>
  </div>
</article>
