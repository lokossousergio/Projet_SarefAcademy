{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mot de passe oublié | Saref Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="{% static 'css/formation.css' %}" rel="stylesheet" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #f5f7fe; }
      .reset-card { width: min(100%, 480px); border: 1px solid #d6defb; border-radius: 1.25rem; }
      .reset-icon { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border-radius: 1rem; background: #ebeffd; color: #335cec; font-size: 1.5rem; }
      .form-control { min-height: 3.2rem; background: #f8fafc; }
      .form-control:focus { border-color: #335cec; box-shadow: 0 0 0 .2rem #335cec26; }
    </style>
  </head>
  <body>
    {% include "partials/feedback_modal.html" %}
    <main class="card reset-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="reset-icon mb-4"><i class="bi bi-envelope-check"></i></div>
        <p class="text-primary fw-semibold mb-2">SAREF ACADEMY</p>
        <h1 class="h3 fw-bold">Mot de passe oublié ?</h1>
        <p class="text-secondary mb-4">Indiquez l’adresse e-mail de votre compte. Nous vous enverrons un code valable 10 minutes.</p>
        <form method="post" class="needs-validation" id="emailForm" novalidate>
          {% csrf_token %}
          <label for="email" class="form-label fw-semibold">Adresse e-mail</label>
          <input id="email" name="email" type="email" class="form-control mb-3" autocomplete="email" required value="{{ request.POST.email|default:'' }}" placeholder="vous@exemple.com" />
          <button class="btn btn-primary w-100 py-2" type="submit">Recevoir le code</button>
        </form>
        <a class="d-block text-center mt-4 text-decoration-none" href="{% url 'connexion-etudiant' %}"><i class="bi bi-arrow-left me-1"></i>Retour à la connexion</a>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const emailForm = document.getElementById("emailForm");
      emailForm.addEventListener("submit", function (event) {
        const email = document.getElementById("email");
        email.setCustomValidity(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()) ? "" : "Adresse e-mail invalide.");
        if (!emailForm.checkValidity()) {
          event.preventDefault();
          emailForm.classList.add("was-validated");
          showFeedbackModal("Saisissez une adresse e-mail valide.");
        }
      });
    </script>
  </body>
</html>
