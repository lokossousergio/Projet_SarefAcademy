{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérifier le code | Saref Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="{% static 'css/formation.css' %}" rel="stylesheet" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #f5f7fe; }
      .reset-card { width: min(100%, 480px); border: 1px solid #d6defb; border-radius: 1.25rem; }
      .reset-icon { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border-radius: 1rem; background: #ebeffd; color: #335cec; font-size: 1.5rem; }
      .form-control { min-height: 3.2rem; background: #f8fafc; }
      .form-control:focus { border-color: #335cec; box-shadow: 0 0 0 .2rem #335cec26; }
      .code-input { letter-spacing: .35em; text-align: center; font-size: 1.25rem; font-weight: 700; }
    </style>
  </head>
  <body>
    {% include "partials/feedback_modal.html" %}
    <main class="card reset-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="reset-icon mb-4"><i class="bi bi-shield-lock"></i></div>
        <p class="text-primary fw-semibold mb-2">SAREF ACADEMY</p>
        <h1 class="h3 fw-bold">Vérifiez votre code</h1>
        <p class="text-secondary mb-4">Saisissez le code à 6 chiffres reçu par e-mail, puis choisissez un nouveau mot de passe.</p>
        <form method="post" class="needs-validation" id="resetForm" novalidate>
          {% csrf_token %}
          <label for="code" class="form-label fw-semibold">Code de vérification</label>
          <input id="code" name="code" class="form-control code-input mb-3" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000" />
          <label for="password" class="form-label fw-semibold">Nouveau mot de passe</label>
          <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="new-password" required minlength="8" placeholder="8 caractères minimum" />
          <label for="password2" class="form-label fw-semibold">Confirmer le mot de passe</label>
          <input id="password2" name="password2" type="password" class="form-control mb-4" autocomplete="new-password" required minlength="8" placeholder="Répétez le mot de passe" />
          <button class="btn btn-primary w-100 py-2" type="submit">Changer mon mot de passe</button>
        </form>
        <a class="d-block text-center mt-4 text-decoration-none" href="{% url 'mot-de-passe-oublie' %}"><i class="bi bi-arrow-repeat me-1"></i>Demander un nouveau code</a>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Vérifie le code et la confirmation avant l'envoi.
      const form = document.getElementById("resetForm");
      form.addEventListener("submit", function (event) {
        const first = document.getElementById("password");
        const second = document.getElementById("password2");
        document.getElementById("code").setCustomValidity(/^[0-9]{6}$/.test(document.getElementById("code").value.trim()) ? "" : "Le code doit contenir 6 chiffres.");
        first.setCustomValidity(/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(first.value) ? "" : "Ajoutez au moins 8 caractères, une lettre et un chiffre.");
        second.setCustomValidity(first.value === second.value ? "" : "Les mots de passe ne correspondent pas.");
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
          showFeedbackModal("Vérifiez le code à 6 chiffres et les deux mots de passe.");
        }
        form.classList.add("was-validated");
      });
    </script>
  </body>
</html>
