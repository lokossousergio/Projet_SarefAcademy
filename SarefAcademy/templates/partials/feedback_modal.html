{% load static %}
<link rel="stylesheet" href="{% static 'css/modal_global.css' %}" />
<div class="modal fade saref-feedback-modal" id="feedbackModal" data-level="{% for message in messages %}{% if forloop.first %}{% if message.level_tag == 'success' or message.level_tag == 'warning' or message.level_tag == 'info' %}{{ message.level_tag }}{% else %}error{% endif %}{% endif %}{% empty %}error{% endfor %}" data-show-on-load="{% if messages %}true{% else %}false{% endif %}" tabindex="-1" aria-labelledby="feedbackModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="feedback-brand">
        <img src="{% static 'images/saref-mark.png' %}" alt="" width="34" height="34" />
        <span>Saref <b>Academy</b></span>
      </div>
      <!-- Icônes intégrées (SVG) : ne dépendent d'aucune police d'icônes. -->
      <div class="feedback-icon" aria-hidden="true">
        <svg class="fi fi-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <svg class="fi fi-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6.5v7"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg>
        <svg class="fi fi-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.2L2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
        <svg class="fi fi-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 11v6.5"/><circle cx="12" cy="6.8" r=".6" fill="currentColor"/></svg>
      </div>
      <h2 class="modal-title" id="feedbackModalTitle">
        <span class="ft ft-success">C’est réussi !</span>
        <span class="ft ft-error">Vérifiez les informations</span>
        <span class="ft ft-warning">Attention</span>
        <span class="ft ft-info">Information</span>
      </h2>
      <div class="feedback-message" id="feedbackModalBody">
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
      </div>
      <button type="button" class="btn feedback-button" data-bs-dismiss="modal">Compris</button>
      <button type="button" class="btn-close feedback-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
    </div>
  </div>
</div>
<style>
  .saref-feedback-modal { --fb-color: #d92d20; --fb-bg: #fff1f0; }
  .saref-feedback-modal[data-level="success"] { --fb-color: #16803c; --fb-bg: #eaf8ef; }
  .saref-feedback-modal[data-level="warning"] { --fb-color: #b45309; --fb-bg: #fff7e6; }
  .saref-feedback-modal[data-level="info"] { --fb-color: #335cec; --fb-bg: #eef2ff; }
  .saref-feedback-modal .modal-dialog { max-width: 440px; }
  .saref-feedback-modal .modal-content { position: relative; display: flex; flex-direction: column; align-items: center; padding: 1.75rem 2rem 1.75rem; border: 1px solid #e5eaf5; border-radius: 1.4rem; font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; box-shadow: 0 24px 80px rgba(15, 23, 42, .2); }
  .saref-feedback-modal .feedback-brand { display: flex; align-items: center; justify-content: center; gap: .5rem; margin: 0 0 1.25rem; color: #14255e; font-size: .9rem; font-weight: 700; line-height: 1; }
  .saref-feedback-modal .feedback-brand img { display: block; flex: 0 0 34px; width: 34px; height: 34px; max-width: none; object-fit: contain; border-radius: 9px; }
  .saref-feedback-modal .feedback-brand b { color: #335cec; }
  .saref-feedback-modal .feedback-icon { display: grid; flex: 0 0 auto; width: 72px; height: 72px; place-items: center; margin: 0 auto 1rem; border-radius: 50%; background: var(--fb-bg); color: var(--fb-color); box-shadow: 0 0 0 8px color-mix(in srgb, var(--fb-bg) 55%, transparent); }
  .saref-feedback-modal .feedback-icon svg { display: none; width: 36px; height: 36px; }
  .saref-feedback-modal[data-level="success"] .fi-success,
  .saref-feedback-modal[data-level="error"] .fi-error,
  .saref-feedback-modal[data-level="warning"] .fi-warning,
  .saref-feedback-modal[data-level="info"] .fi-info { display: block; }
  .saref-feedback-modal .ft { display: none; }
  .saref-feedback-modal[data-level="success"] .ft-success,
  .saref-feedback-modal[data-level="error"] .ft-error,
  .saref-feedback-modal[data-level="warning"] .ft-warning,
  .saref-feedback-modal[data-level="info"] .ft-info { display: inline; }
  .saref-feedback-modal .modal-title { margin: 0; color: #0f172a; font-size: 1.3rem; font-weight: 800; line-height: 1.3; }
  .saref-feedback-modal .feedback-message { width: 100%; max-width: 34rem; margin: .55rem 0 1.4rem; color: #475569; font-size: .95rem; line-height: 1.6; }
  .saref-feedback-modal .feedback-message p { margin: 0; }
  .saref-feedback-modal .feedback-message p + p { margin-top: .35rem; }
  .saref-feedback-modal .feedback-button { min-width: 150px; padding: .7rem 1.25rem; border: 0; border-radius: .75rem; background: #335cec; color: #fff; font-weight: 700; }
  .saref-feedback-modal .feedback-button:hover, .saref-feedback-modal .feedback-button:focus-visible { background: #2b4ec9; color: #fff; }
  .saref-feedback-modal .feedback-close { position: absolute; top: 1rem; right: 1rem; }
  @media (max-width: 575px) { .saref-feedback-modal .modal-content { padding: 1.6rem 1.25rem 1.35rem; } }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const modal = document.getElementById("feedbackModal");
    if (modal && window.bootstrap && modal.dataset.showOnLoad === "true") {
      bootstrap.Modal.getOrCreateInstance(modal).show();
    }
  });
  // niveau : true (succès), false (erreur) ou "success" | "error" | "warning" | "info".
  window.showFeedbackModal = function (message, niveau) {
    const modal = document.getElementById("feedbackModal");
    if (!modal || !window.bootstrap) return;
    const level = niveau === true ? "success" : (niveau === false || !niveau ? "error" : niveau);
    modal.dataset.level = level;
    document.getElementById("feedbackModalBody").textContent = message;
    bootstrap.Modal.getOrCreateInstance(modal).show();
  };
</script>
