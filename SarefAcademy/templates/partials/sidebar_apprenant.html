{% load static %}
<aside
  class="sidebar sidebar-apprenant offcanvas-lg offcanvas-start"
  id="sidebar"
  tabindex="-1"
  aria-label="Navigation étudiant"
>
  <div class="d-flex justify-content-end d-lg-none p-3 pb-0">
    <button
      type="button"
      class="btn-close btn-close-white"
      data-bs-dismiss="offcanvas"
      data-bs-target="#sidebar"
      aria-label="Fermer le menu"
    ></button>
  </div>
  <div class="offcanvas-body sidebar-inner">
    <a class="brand" href="{% url 'etudiant_dashboard' %}">
      <span class="brand-mark">
        <img
          src="{% static 'images/saref-mark.png' %}"
          alt="Symbole SAREF Academy"
        />
      </span>
      <div>
        <b>SAREF Academy</b>
        <small>ESPACE ÉTUDIANT</small>
      </div>
    </a>
    <nav class="d-grid gap-1 mt-4" aria-label="Menu principal">
      <a
        class="navitem {% if request.resolver_match.url_name == 'etudiant_dashboard' %}active{% endif %}"
        href="{% url 'etudiant_dashboard' %}"
      >
        <i class="bi bi-grid-1x2"></i>
        Tableau de bord
      </a>
      <a
        class="navitem {% if request.resolver_match.url_name in 'etudiant_formations etudiant_formation_detail' %}active{% endif %}"
        href="{% url 'etudiant_formations' %}"
      >
        <i class="bi bi-mortarboard"></i>
        Mes formations
      </a>
      <a
        class="navitem {% if request.resolver_match.url_name == 'etudiant_paiements' %}active{% endif %}"
        href="{% url 'etudiant_paiements' %}"
      >
        <i class="bi bi-credit-card"></i>
        Paiements
      </a>
      <div class="nav-cap">MON COMPTE</div>
      <a
        class="navitem {% if request.resolver_match.url_name == 'etudiant_profil' %}active{% endif %}"
        href="{% url 'etudiant_profil' %}"
      >
        <i class="bi bi-person"></i>
        Mon profil
      </a>
    </nav>
    <div class="sidebar-user mt-auto">
      {% if etudiant.photo %}
      <span class="avatar avatar-md overflow-hidden p-0" style="border-radius:50%;">
        <img src="{{ etudiant.photo.url }}" alt="Photo" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
      </span>
      {% else %}
      <span class="avatar avatar-md">
        {{ etudiant.prenom|first|upper|default:"E" }}
      </span>
      {% endif %}
      <div class="who">
        <b>{{ etudiant.prenom|default:"Étudiant" }} {{ etudiant.nom }}</b>
        <small>Étudiant</small>
      </div>
    </div>
    <a class="navitem mt-2" href="{% url 'deconnexion-etudiant' %}">
      <i class="bi bi-box-arrow-right"></i>
      Déconnexion
    </a>
  </div>
</aside>
