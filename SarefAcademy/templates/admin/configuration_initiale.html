{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Configuration initiale | SAREF</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f3f6fc;
        font-family: system-ui;
        color: #1d2a43;
      }
      .panel {
        max-width: 720px;
        margin: 5vh auto;
        background: #fff;
        padding: 34px;
        border-radius: 22px;
        box-shadow: 0 18px 55px #1c376015;
      }
      .brand {
        color: #335cec;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">SAREF Academy · Administration</div>
      <h1 class="h3 mt-3">Configuration initiale obligatoire</h1>
      <p class="text-secondary">
        Avant d’accéder au tableau de bord, configurez la première vague et
        l’année académique.
      </p>
      {% for message in messages %}
      <div class="alert alert-warning">{{ message }}</div>
      {% endfor %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Nom de la vague</label>
          <input
            class="form-control"
            name="nom"
            placeholder="Ex. 2026-A"
            required=""
          />
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Début de la vague</label>
            <input
              class="form-control"
              name="date_debut"
              required=""
              type="datetime-local"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Fin de la vague</label>
            <input
              class="form-control"
              name="date_fin"
              required=""
              type="datetime-local"
            />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Année académique</label>
          <input
            class="form-control"
            name="annee_academique"
            placeholder="2026-2027"
            required=""
          />
        </div>
        <button class="btn btn-primary px-4">
          Enregistrer et accéder au tableau de bord
        </button>
      </form>
      <form action="{% url 'deconnexion' %}" class="mt-3" method="post">
        {% csrf_token %}
        <button class="btn btn-link px-0">Se déconnecter</button>
      </form>
    </main>
  </body>
</html>
