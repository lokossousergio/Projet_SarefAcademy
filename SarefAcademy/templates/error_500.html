<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Erreur serveur | Saref Academy</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!--
    Aucune classe custom : on redefinit juste les variables Bootstrap
    (--bs-primary et --bs-dark) pour que btn-primary, bg-primary,
    text-primary, bg-dark, badge... utilisent directement les couleurs
    de la charte Saref Academy. Tout le reste du fichier n'utilise
    que des classes Bootstrap standards.
  -->
  <style>
    :root, [data-bs-theme=light]{
      --bs-primary: #315BEA;
      --bs-primary-rgb: 49, 91, 234;
      --bs-primary-bg-subtle: #EEF2FF;
      --bs-dark: #111827;
      --bs-dark-rgb: 17, 24, 39;
    }
  </style>
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container text-center" style="max-width:640px;">

    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-4" style="width:80px; height:80px;">
      <i class="fa-solid fa-server fs-3"></i>
    </div>

 
    <h1 class="display-1 fw-bold text-primary">500</h1>

    <h2 class="h3 fw-bold mb-3">Une erreur est survenue de notre côté</h2>

    <p class="text-white-50 mb-4 mx-auto" style="max-width:440px;">
      Nos serveurs rencontrent un souci technique. Ce n'est pas de votre faute,
      nous travaillons déjà à le résoudre. Merci de réessayer dans quelques instants.
    </p>

    <a href="javascript:location.reload()" class="btn btn-primary btn-lg rounded-pill px-4">
      <i class="fa-solid fa-rotate-right me-2"></i>
      Réessayer
    </a>

  </div>

</body>
</html>
