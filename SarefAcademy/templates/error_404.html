<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page introuvable | Saref Academy</title>
    <link rel="icon" href="{% static 'images/WhatsApp_Image_2026-08-17_at_18.19.27-removebg-preview.png' %}" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!--
    Aucune classe custom : on redefinit juste les variables Bootstrap
    (--bs-primary et --bs-dark) pour que btn-primary, bg-primary,
    text-primary, bg-dark, badge... utilisent directement les couleurs
    de la charte Saref Academy. Tout le reste du fichier n'utilise
    que des classes Bootstrap standards.
  -->
  <style>
    :root, [data-bs-theme=light]{
      --bs-primary: #315BEA;
      --bs-primary-rgb: 49, 91, 234;
      --bs-primary-bg-subtle: #EEF2FF;
      --bs-dark: #111827;
      --bs-dark-rgb: 17, 24, 39;
    }
  </style>
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container text-center" style="max-width:640px;">

    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-4" style="width:80px; height:80px;">
      <i class="fa-solid fa-map-location-dot fs-3"></i>
    </div>

    <h1 class="display-1 fw-bold text-primary">404</h1>

    <h2 class="h3 fw-bold mb-3">Cette page a pris un autre chemin</h2>

    <p class="text-white-50 mb-4 mx-auto" style="max-width:440px;">
      Le lien que vous avez suivi est peut-être obsolète, ou l'adresse a été
      mal saisie. Retournez à l'accueil pour continuer votre inscription
      à la bourse de formation.
    </p>

    <a href="{% url 'index' %}" class="btn btn-primary btn-lg rounded-pill px-4">
      <i class="fa-solid fa-house me-2"></i>
      Retour à l'accueil
    </a>

  </div>

</body>
</html>
